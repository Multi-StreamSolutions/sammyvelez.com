name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build custom-domain site
        run: npm run build

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert reels for browser playback
        run: |
          ffmpeg -y -i "A-Sammy-Voiceover-Reel-ScreenRecording_05-18-2026 06-14-18_1.MOV" -c:v libx264 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 128k "dist/voiceover-reel-01.mp4"
          ffmpeg -y -i "A-Sammy-Voiceover-2-33b4da129.MOV" -c:v libx264 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 128k "dist/voiceover-reel-02.mp4"

      - name: Apply site refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text()
          old = ".connect{background:#e6e4df;color:#111;text-align:center;padding:90px 7vw}.connect .eyebrow{color:#666;margin-bottom:22px}.connect h2{font:clamp(52px,8vw,105px)/.9 'Italiana';margin:0}.connect p{max-width:620px;margin:25px auto 40px;color:#555;line-height:1.7}.connect-links{max-width:900px;margin:auto;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.connect-links a{border:1px solid #777;padding:15px 18px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;transition:.2s}.connect-links a:hover{background:#111;color:#fff}"
          new = ".connect{background:linear-gradient(135deg,#202020 0%,#151515 55%,#242424 100%);color:#f4f1ea;text-align:center;padding:100px 7vw;border-top:1px solid #ffffff24;border-bottom:1px solid #ffffff24}.connect .eyebrow{color:#c8c8c8;margin-bottom:24px;font-size:11px}.connect h2{font:clamp(54px,8vw,108px)/.9 'Italiana';margin:0;color:#fff}.connect h2 em{color:#c7c6c2}.connect p{max-width:680px;margin:28px auto 42px;color:#d0d0d0;line-height:1.75;font-size:17px}.connect-links{max-width:960px;margin:auto;display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.connect-links a{border:1px solid #777;background:#ffffff08;color:#f5f5f5;padding:16px 20px;font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;transition:.2s}.connect-links a:hover{background:#f1f1ee;color:#111;border-color:#f1f1ee}"
          if old not in s:
              raise SystemExit('Connect CSS signature not found')
          s = s.replace(old, new)
          s = s.replace('https://app.mi-card.io/sammyvelez', 'https://app.micard.io//sammyvelez/')
          s = s.replace('A-Sammy-Voiceover-Reel-ScreenRecording_05-18-2026%2006-14-18_1.MOV\" type=\"video/quicktime', 'voiceover-reel-01.mp4\" type=\"video/mp4')
          s = s.replace('A-Sammy-Voiceover-2-33b4da129.MOV\" type=\"video/quicktime', 'voiceover-reel-02.mp4\" type=\"video/mp4')
          p.write_text(s)
          PY

      - name: Verify custom-domain asset URLs and links
        run: |
          test -f dist/index.html
          test -f dist/voiceover-reel-01.mp4
          test -f dist/voiceover-reel-02.mp4
          grep -q '/assets/' dist/index.html
          ! grep -q '/sammyvelez.com/assets/' dist/index.html
          grep -q 'linear-gradient(135deg,#202020' dist/index.html
          grep -q 'https://app.micard.io//sammyvelez/' dist/index.html
          grep -q 'voiceover-reel-01.mp4' dist/index.html
          grep -q 'voiceover-reel-02.mp4' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
